<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>TOEIC600 英単語3000</title></head><body><main class="app"><a class="homeLink" href="../">← トップページに戻る</a><header class="hero"><div><h1>TOEIC600 英単語3000</h1><p>単語・熟語・例文・音声つき</p></div><div class="count"><span id="total">0</span>語</div></header><section class="card"><div class="row"><input id="search" placeholder="単語・意味・例文を検索"><select id="filter"><option value="">全カテゴリ</option></select></div><div class="row buttons"><button id="randomBtn">ランダム</button><button id="quizBtn">4択テスト</button><button id="wrongBtn">苦手だけ</button><button id="savedBtn">保存だけ</button></div><div class="stats"><div><b id="learned">0</b><span>学習</span></div><div><b id="known">0</b><span>覚えた</span></div><div><b id="weak">0</b><span>苦手</span></div><div><b id="saved">0</b><span>保存</span></div></div></section><section id="card" class="wordCard"><div class="topline"><span id="level">TOEIC600</span><button id="saveBtn">☆ 保存</button></div><h2 id="word">word</h2><div id="meaning" class="meaning hiddenMeaning">意味</div><button id="showMeaningBtn" class="showMeaning">日本語を見る</button><div class="audioGrid"><button id="speakWord">単語 🔊</button><button id="speakExample">例文 🔊</button><button id="speakSlow">ゆっくり 🔊</button></div><div class="voiceBox"><label>声を選ぶ</label><select id="voiceSelect"></select><div class="voiceSliders"><label>速さ <input id="rateRange" type="range" min="0.55" max="1.05" step="0.05" value="0.82"></label><label>高さ <input id="pitchRange" type="range" min="0.8" max="1.25" step="0.05" value="1.0"></label></div><p>自然な声が出ない時は、端末側の英語音声を選んでください。</p></div><div class="example"><p id="example">Example sentence.</p><p id="exampleJa">日本語訳</p></div><div id="quizArea" class="quizArea hidden"><h3>意味を選んでください</h3><div id="quizChoices" class="quizChoices"></div><div id="quizResult" class="quizResult hidden"></div></div><div class="answerBtns"><button id="weakMark">苦手</button><button id="knownMark">覚えた</button></div><button id="nextBtn" class="next">次へ</button></section><section class="card importBox"><h3>単語JSONを読み込む</h3><p>あとから単語を追加・差し替えできます。</p><label>JSONを選ぶ<input id="importFile" type="file" accept=".json"></label><button id="resetBtn">初期3000語に戻す</button></section></main><script src="words.js"></script><script src="app.js"></script></body></html>
